name: CI Tests

on:
  push:
    # refactor/** lets each phase branch of the 1.0 refactoring run CI before a pull request
    branches: [ main, 'refactor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[all]

    - name: Run unit tests
      run: make test-unit

    - name: Run integration tests
      run: make test-integration

    - name: Generate coverage report
      run: make test-coverage

    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: |
          htmlcov/
          coverage.xml
        retention-days: 30

    - name: Install the built wheel in a clean virtual environment
      run: |
        python -m pip install --upgrade build
        rm -rf dist/ build/
        python -m build --wheel
        python -m venv /tmp/wheel-env
        /tmp/wheel-env/bin/pip install dist/*.whl
        # run outside the repository so that the installed package is imported, not the sources
        cd /tmp
        /tmp/wheel-env/bin/python -c "import smartcer, smartcer.core, smartcer.data, smartcer.forecasts, smartcer.oracle, smartcer.gym, smartcer.gym.controllers, smartcer.gym.metrics, smartcer.gym.tracking; print('Installed smartcer', smartcer.__version__)"
