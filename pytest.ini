[pytest]
# test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Slow-running tests (e.g., full training cycles)

# output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib

# logging
log_cli = false
log_cli_level = INFO

# warnings: errors, except deprecations
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # defect S14 in smartcer/cer_models/node_models.py (0.6.2); remove with that module in phase 3
    ignore:invalid escape sequence:SyntaxWarning
