[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SmartCer"
version = "0.2.0"
description = "Gymnasium environment for Renewable Energy Community (CER)"
authors = [{ name = "Leonardo Guiducci", email = "leonardo.guiducci@unisi.it" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["gym", "renewable-energy", "environment", "reinforcement-learning"]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.5"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[tool.setuptools]
packages = ["smartcer"]
include-package-data = true

[project.urls]
homepage = "https://github.com/unisi-lab305/SmartCer"
repository = "https://github.com/unisi-lab305/SmartCer"
documentation = "https://github.com/unisi-lab305/SmartCer/blob/main/README.md"
