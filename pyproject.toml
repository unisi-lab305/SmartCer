[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SmartCer"
version = "0.1.0"
description = "Gymnasium environment for the Renewable Energy Community (CER)"
authors = ["Leonardo Guiducci"]
authors-email = ["leonardo.guiducci@unisi.it"]
license = "MIT"
readme = "README.md"
keywords = ["gym", "renewable-energy", "environment", "reinforcement-learning"]
categories = ["Environment :: OpenAI Gym"]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.5"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
homepage = "https://github.com/unisi-lab305/SmartCer"
repository = "https://github.com/unisi-lab305/SmartCer"
documentation = ""